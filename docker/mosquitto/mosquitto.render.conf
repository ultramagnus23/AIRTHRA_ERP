# Render-specific mosquitto config. Plaintext only, no TLS listener - this
# is a deliberate simplification, safe ONLY because it holds in this one
# context: Render "private services" (pserv) have no public IP and are
# reachable exclusively over Render's internal network by other services
# in the same project, never from the public internet. That is exactly
# the property the local dev-only plaintext listener (docker/mosquitto/
# mosquitto.conf, port 1883) already relies on - see that file's own
# comment. This is NOT a general recommendation to skip TLS; a real
# remote edge unit talking to this broker over the public internet still
# needs the TLS listener (8883) and the cert machinery in
# docker/mosquitto/gen_certs.sh, unchanged. This file only covers the
# "prove the app to a client" deployment, where every MQTT participant
# (the mock edge daemon, ingest service) is itself another Render private
# service on the same internal network.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

password_file /mosquitto/config/passwd
allow_anonymous false

listener 1883
protocol mqtt
