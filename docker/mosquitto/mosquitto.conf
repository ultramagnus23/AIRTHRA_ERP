# Airthra mosquitto config
# Per-device credentials are stored in ./passwd (generated with mosquitto_passwd, see README).

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# All listeners require authentication against the password file.
password_file /mosquitto/config/passwd
allow_anonymous false

# ---------------------------------------------------------------------------
# Production listener: TLS on 8883, per-device client certs optional but the
# CA/server cert pair (see gen_certs.sh) at minimum encrypts the transport and
# authenticates the broker to the device. Combine with password_file above
# for per-device username/password auth, or set require_certificate true to
# do full mTLS once devices are provisioned with client certs.
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2

# Websockets over TLS, e.g. for browser/grafana live widgets later.
listener 9001
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# ---------------------------------------------------------------------------
# DEV ONLY: plaintext listener, no TLS. Convenient for local development
# without generating/trusting certs. Do NOT expose this port outside of
# localhost/dev docker network in any non-dev environment - comment out or
# firewall it off before staging/prod.
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt
