networks:
  airthra:
    name: airthra

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: airthra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bound to loopback by default: nothing outside this host should reach
    # Postgres directly (the API and workers use the compose network).
    # Docker publishes to 0.0.0.0 when no bind address is given, which on
    # any cloud VM without a host firewall means a public database.
    # Override PRIVATE_BIND only if you know why you're doing it.
    ports:
      - "${PRIVATE_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - airthra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: airthra_mosquitto
    restart: unless-stopped
    ports:
      # 8883/9001 stay publicly bound on purpose - remote edge units
      # connect to them over TLS with per-device certs. 1883 is the
      # plaintext dev listener and is loopback-only so it can never
      # accidentally accept unauthenticated field traffic.
      - "${MQTT_TLS_PORT:-8883}:8883"   # TLS, per-device cert auth (prod)
      - "${PRIVATE_BIND:-127.0.0.1}:${MQTT_DEV_PORT:-1883}:1883"   # DEV ONLY plaintext
      - "${MQTT_WS_PORT:-9001}:9001"    # websockets (TLS)
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./docker/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - airthra

  caddy:
    image: caddy:latest
    container_name: airthra_caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - airthra

  grafana:
    image: grafana/grafana:latest
    container_name: airthra_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Loopback-only: reached through Caddy, not directly.
      - "${PRIVATE_BIND:-127.0.0.1}:${GF_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - airthra
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: airthra_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9090"
    ports:
      # Loopback-only: object access goes through the API, and the console
      # is an admin surface that has no business being internet-reachable.
      - "${PRIVATE_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${PRIVATE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9090}:9090"
    volumes:
      - minio_data:/data
    networks:
      - airthra
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: airthra_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - airthra
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET} &&
      mc anonymous set none local/${MINIO_BUCKET} &&
      echo 'bucket ${MINIO_BUCKET} ready (private)'
      "
    restart: "no"

volumes:
  pg_data:
  grafana_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:
  caddy_data:
  caddy_config:
